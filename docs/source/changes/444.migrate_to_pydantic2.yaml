category: changed
summary: "Migrate TARDIS to pydantic 2"
description: |
  TARDIS now requires pydantic 2 instead of pydantic 1. Validation error
  responses (status 422) of the REST API use the pydantic 2 error format, e.g.
  ``"type": "missing"`` instead of ``"value_error.missing"``, with an additional
  ``input`` field. Integer fields of the site configuration now reject values
  with a fractional part, such as ``1.5``, which pydantic 1 silently truncated.
