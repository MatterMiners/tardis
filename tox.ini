[tox]
requires =
    tox>=4
    tox-uv
env_list = py310, py311, py312, py313, py314, lint

[testenv]
runner = uv-venv-runner
package = editable
extras = contrib
deps = coverage
commands = coverage run -m unittest {posargs:-v}

[testenv:lint]
skip_install = true
deps =
    flake8
    flake8-bugbear
    black
commands =
    flake8 tardis tests setup.py
    black tardis tests setup.py --diff --check --target-version py313

[testenv:docs]
extras = docs
commands = sphinx-build -b html docs/source docs/build/html
